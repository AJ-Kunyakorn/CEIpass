name: Backend CI

on:
  pull_request:
    paths:
      - "BackEnd/**"
      - "Database/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "BackEnd/**"
      - "Database/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        run: mvn --batch-mode --file BackEnd/pom.xml verify
